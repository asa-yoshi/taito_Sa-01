<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>レシピ一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h1 class="text-primary mb-4">🍽 レシピ一覧</h1>
    <table class="table table-striped table-bordered">
        <thead class="table-light">
            <tr>
                <th>タイトル</th>
                <th>カテゴリ</th>
                <th>材料</th>
                <th>リンク</th>
            </tr>
        </thead>
        <tbody>
            {% for title, category, ingredients, url in recipes %}
            <tr>
                <td>{{ title }}</td>
                <td>{{ category }}</td>
                <td>{{ ingredients }}</td>
                <td><a href="{{ url }}" target="_blank">見る</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
      <div class="d-flex justify-content-end mb-3">
        <a href="/" class="btn btn-outline-secondary">🏠 ホームに戻る</a>
      </div>
</body>
</html>
