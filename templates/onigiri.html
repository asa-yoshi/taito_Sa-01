<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ファミマおにぎり情報</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
  <h1 class="text-primary mb-4">🍙 ファミマのおにぎり情報</h1>

  <div class="row row-cols-1 row-cols-md-2 g-4">
    {% for item in items %}
    <div class="col">
      <div class="card h-100 shadow">
        <div class="card-body">
          <h5 class="card-title text-success">{{ item.title }}</h5>
          <ul class="list-group list-group-flush">
            <li class="list-group-item">🔥 熱量: {{ item.energy }} kcal</li>
            <li class="list-group-item">💪 たんぱく質: {{ item.protein }} g</li>
            <li class="list-group-item">🧈 脂質: {{ item.fat }} g</li>
            <li class="list-group-item">🍚 炭水化物: {{ item.carbs }} g</li>
            <li class="list-group-item">🧂 食塩相当量: {{ item.salt }} g</li>
          </ul>
          <!--<a href="{{ item.url }}" class="btn btn-outline-primary mt-3" target="_blank">公式ページへ</a> -->
        </div>
      </div>
    </div>
    {% endfor %}
  </div>

  <div class="mt-5">
    <a href="/" class="btn btn-secondary">🏠 ホームに戻る</a>
  </div>
</body>
</html>
