<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>カテゴリ結果一覧</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="text-center text-primary mb-4">選択されたカテゴリの商品一覧</h2>

    {% for item in items %}
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title">{{ item.title }}</h5>
            <ul class="list-group list-group-flush">
                <li class="list-group-item">🔥 熱量: {{ item.energy }} kcal</li>
                <li class="list-group-item">💪 たんぱく質: {{ item.protein }} g</li>
                <li class="list-group-item">🧈 脂質: {{ item.fat }} g</li>
                <li class="list-group-item">🍚 炭水化物: {{ item.carbs }} g</li>
                <li class="list-group-item">🧂 食塩相当量: {{ item.salt }} g</li>
            </ul>
        </div>
    </div>
    {% endfor %}

    <div class="text-center mt-4">
        <a href="/" class="btn btn-secondary">🏠 ホームに戻る</a>
    </div>
</div>

</body>
</html>
